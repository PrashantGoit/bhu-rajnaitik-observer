<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="g" cx="48%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#1E2A3D" stop-opacity="1"/>
      <stop offset="55%" stop-color="#0E1622" stop-opacity="1"/>
      <stop offset="100%" stop-color="#05090F" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#2A3645" opacity="0.85"/>
    </pattern>
    <pattern id="dotsSparse" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#3A4A60" opacity="0.5"/>
    </pattern>
    <radialGradient id="northAmerica" cx="22%" cy="38%" r="22%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="southAmerica" cx="32%" cy="72%" r="14%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="europe" cx="52%" cy="32%" r="10%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="africa" cx="55%" cy="58%" r="18%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="asia" cx="74%" cy="40%" r="22%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="oceania" cx="84%" cy="76%" r="11%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="continents">
      <rect width="1080" height="1080" fill="black"/>
      <rect width="1080" height="1080" fill="url(#northAmerica)"/>
      <rect width="1080" height="1080" fill="url(#southAmerica)"/>
      <rect width="1080" height="1080" fill="url(#europe)"/>
      <rect width="1080" height="1080" fill="url(#africa)"/>
      <rect width="1080" height="1080" fill="url(#asia)"/>
      <rect width="1080" height="1080" fill="url(#oceania)"/>
    </mask>
  </defs>
  <rect width="1080" height="1080" fill="url(#g)"/>
  <rect width="1080" height="1080" fill="url(#dotsSparse)" opacity="0.4"/>
  <g mask="url(#continents)">
    <rect width="1080" height="1080" fill="url(#dots)"/>
  </g>
  <rect width="1080" height="1080" fill="url(#vignette)"/>
</svg>
